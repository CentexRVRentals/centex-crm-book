<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Camper &amp; Travel Trailer Rentals in Kyle, TX | Centex RV Rentals</title>
    <meta name="description" content="Travel trailer and RV rentals in Kyle, Texas. Browse the fleet, check real availability, and request your dates. Pick up from us or have it delivered." />
    <link rel="canonical" href="__SITE_ORIGIN__/" />

    <!-- b0.10 — THE ORIGIN IS STAMPED IN AT BUILD. The placeholder in the
         canonical above and in og:url below is replaced by vite.config.js from
         scripts/site-origin.mjs (VITE_SITE_URL, else Netlify's URL, else
         localhost). Writing a hostname here is how a site keeps pointing at
         yesterday's domain; check-bundle refuses a build where the
         placeholder survived. -->

    <!-- b0.8 — INDEXABLE. The noindex that lived here through b0.1-b0.7 is
         gone, and public/robots.txt now allows crawling. They were changed
         TOGETHER on purpose: a meta tag and a robots.txt that disagree fail
         silently, and which one wins depends on the crawler. -->

    <!-- What a link pasted into a text message shows. These are the DEFAULTS;
         a camper page overwrites them at runtime from its own data. A crawler
         that does not run JavaScript sees only these, which is the honest
         limit of a client-rendered site and the reason a prerender step is on
         the list for after launch. -->
    <meta property="og:site_name" content="Centex RV Rentals" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Camper &amp; Travel Trailer Rentals in Kyle, TX" />
    <meta property="og:description" content="Browse the fleet, check real availability, and request your dates." />
    <meta property="og:url" content="__SITE_ORIGIN__/" />
    <meta name="twitter:card" content="summary" />

    <meta name="theme-color" content="#3D6B54" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
